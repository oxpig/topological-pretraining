[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topological-pretraining"
version = "0.1.0"
requires-python = "==3.12.*"
description = "Python code for experiments on pre-training graph isomorphism networks with ECFPs to improve QSAR prediction."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Sam Money-Kyrle" }]

urls = { Repository = "https://github.com/oxpig/topological-pretraining" }
dependencies = [
  "pyyaml",
  "ipykernel",
  "ipywidgets",
  "scikit-learn==1.6.0",
  "tqdm",
  "pandas",
  "python-dotenv",
  "optuna==4.2.1",
  "torch==2.5.1",
  "torcheval==0.0.7",
  "torch_geometric==2.6.1",
  "lightgbm==4.6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["topological_pretraining"]

[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "B", "UP", "SIM", "I"
]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
indent-style = "tab"
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
