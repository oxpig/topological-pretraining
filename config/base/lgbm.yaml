LGBM: 
  model_kwargs:
    verbose: 1
  model_hyperparameters:
    tuning: True
    trials: 50
    num_splits: 5
    num_leaves:
      target: int
      low: 10
      high: 100
    learning_rate:
      target: float
      log: True
      low: 0.001
      high: 0.3
    n_estimators:
      target: int
      low: 50
      high: 150
    subsample_for_bin:
      target: int
      low: 50000
      high: 300000
    min_data_in_leaf:
      target: int
      low: 10
      high: 100
    bagging_fraction:
      target: float
      log: False
      low: 0.5
      high: 1.0
    feature_fraction:
      target: float
      log: False
      low: 0.5
      high: 1.0
    reg_alpha:
      target: float
      log: True
      low: 0.001
      high: 10.0
    reg_lambda:
      target: float
      log: True
      low: 0.001
      high: 10.0
